services:
  scheduler-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scheduler-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Data Source=/app/data/scheduler.db"

      Jwt__Issuer: "Scheduler.Api"
      Jwt__Audience: "Scheduler.Client"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in your .env file}"

    healthcheck:
      test:
        - CMD
        - dotnet
        - --info
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    volumes:
      - scheduler-data:/app/data
    
    restart: unless-stopped

volumes:
  scheduler-data: